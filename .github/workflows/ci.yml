name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Install requirements
        run: |
          uv lock --check
          uv sync
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Build sdist + wheel
        run: |
          uv lock --check
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  unit-tests:
    name: "Compiler-free tests • Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - name: Install wheel and pytest only
        shell: bash
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python 'pytest>=8,<9' dist/*.whl
      - name: Test installed wheel without native fixtures
        env:
          STUBGEN_TEST_INSTALLED: "1"
        run: .venv/bin/python -I -m pytest tests/unit tests/test_snapshot_helpers.py

  tests:
    name: "Test 🐍 ${{ matrix.config.python }} • pybind-${{ matrix.config.pybind11-branch }} • ${{ matrix.config.numpy-format }}"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        config:
          [
            {
              pybind11-branch: "v3.0",
              python: "3.13",
              numpy-format: "numpy-array-use-type-var",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v3.0",
              python: "3.13",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v3.0",
              python: "3.12",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v3.0",
              python: "3.11",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v3.0",
              python: "3.10",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v2.13",
              python: "3.13",
              numpy-format: "numpy-array-use-type-var",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v2.13",
              python: "3.13",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v2.13",
              python: "3.12",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v2.13",
              python: "3.11",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v2.13",
              python: "3.10",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "4.2.x",
            },
            {
              pybind11-branch: "v2.12",
              python: "3.13",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "3.28.3",
            },
            {
              pybind11-branch: "v2.11",
              python: "3.13",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "3.28.3",
            },
            {
              pybind11-branch: "v2.9",
              python: "3.13",
              numpy-format: "numpy-array-wrap-with-annotated",
              cmake-version: "3.28.3",
            },
          ]
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Setup Python ${{ matrix.config.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config.python }}

      - uses: astral-sh/setup-uv@v7

      - name: Update CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ matrix.config.cmake-version }}

      - name: Create UV venv
        run: |
          uv venv .venv

      - name: Setup annotations on Linux
        if: runner.os == 'Linux'
        run: uv pip install pytest-github-actions-annotate-failures

      - name: Install requirements
        run: uv sync --group dev --no-install-project

      - name: Install
        shell: bash
        working-directory: dist
        run: uv pip install --disable-pip-version-check *.whl

      - name: Install demo module
        shell: bash
        run: |
          source .venv/bin/activate
          ./tests/install-demo-module.sh --pybind11-branch "${{ matrix.config.pybind11-branch }}"

      - name: Check installed wheel and demo snapshots
        shell: bash
        run: |
          source .venv/bin/activate
          python -I -c 'import sys; from pathlib import Path; import pybind11_stubgen; p = Path(pybind11_stubgen.__file__).resolve(); assert p.is_relative_to(Path(sys.prefix).resolve()), p; print(p)'
          python -m pytest tests/test_snapshot_helpers.py tests/test_demo_stubs.py tests/test_demo_errors.py \
            --pybind11-branch "${{ matrix.config.pybind11-branch }}" \
            --numpy-format "${{ matrix.config.numpy-format }}" \
            --artifacts-dir tmp/pytest-artifacts/ --maxfail=0

      - name: Archive test diagnostics
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: "python-${{ matrix.config.python }}-pybind-${{ matrix.config.pybind11-branch }}-${{ matrix.config.numpy-format }}-diagnostics"
          path: tmp/pytest-artifacts/
          retention-days: 30
          if-no-files-found: ignore

  test-cli-options:
    name: "Runs on 🐍 ${{ matrix.python }} • ${{ matrix.test-package }}"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        test-package: ["gemmi"]
        python:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Create UV venv
        run: |
          uv venv .venv

      - name: Setup annotations on Linux
        if: runner.os == 'Linux'
        run: uv pip install pytest-github-actions-annotate-failures

      - name: Install
        shell: bash
        working-directory: dist
        run: uv pip install --disable-pip-version-check *.whl

      - name: "Install ${{ matrix.test-package }}"
        shell: bash
        run: uv pip install "${{ matrix.test-package }}"

      - name: Generate stubs
        shell: bash
        run: |
          source .venv/bin/activate
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-1 --numpy-array-wrap-with-annotated
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-2 --numpy-array-remove-parameters
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-3 --print-invalid-expressions-as-is
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-4 --numpy-array-use-type-var
          pybind11-stubgen "${{ matrix.test-package }}" --dry-run

  publish:
    name: Publish distribution
    needs: [check, build, unit-tests, tests, test-cli-options]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
