name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Install requirements
        run: |
          uv lock --check
          uv sync
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [check]
    outputs:
      native-matrix: ${{ steps.native-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Derive native test matrix from tox
        id: native-matrix
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --isolated --with tox --with tox-uv \
            tox list -d --no-desc > "$RUNNER_TEMP/native-envs.txt"
          matrix=$(python tests/native_matrix.py "$RUNNER_TEMP/native-envs.txt")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: |
          uv lock --check
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  unit-tests:
    name: "Compiler-free tests • Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - name: Install wheel and pytest only
        shell: bash
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python 'pytest>=8,<9' dist/*.whl
      - name: Test installed wheel without native fixtures
        env:
          STUBGEN_TEST_INSTALLED: "1"
        run: .venv/bin/python -I -m pytest tests/unit tests/test_snapshot_helpers.py

  tests:
    name: "Native tests • ${{ matrix.env }}"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.native-matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - name: Test supplied wheel through shared tox profile
        shell: bash
        env:
          TOX_PROFILE: ${{ matrix.env }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --no-project --isolated --with tox --with tox-uv \
            tox -e "$TOX_PROFILE" --installpkg "${wheels[0]}"
      - name: Archive native build and test diagnostics
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: "${{ matrix.env }}-diagnostics"
          include-hidden-files: true
          path: |
            .tox/${{ matrix.env }}/log/
            .tox/${{ matrix.env }}/tmp/native/**/evidence.json
            .tox/${{ matrix.env }}/tmp/native/**/*.log
            .tox/${{ matrix.env }}/tmp/native/**/CMakeCache.txt
            .tox/${{ matrix.env }}/tmp/native/**/CMakeConfigureLog.yaml
            .tox/${{ matrix.env }}/tmp/pytest-artifacts/
            .tox/${{ matrix.env }}/tmp/native.xml
          retention-days: 30
          if-no-files-found: ignore

  test-cli-options:
    name: "Runs on 🐍 ${{ matrix.python }} • ${{ matrix.test-package }}"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        test-package: ["gemmi"]
        python:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Create UV venv
        run: |
          uv venv .venv

      - name: Setup annotations on Linux
        if: runner.os == 'Linux'
        run: uv pip install pytest-github-actions-annotate-failures

      - name: Install
        shell: bash
        working-directory: dist
        run: uv pip install --disable-pip-version-check *.whl

      - name: "Install ${{ matrix.test-package }}"
        shell: bash
        run: uv pip install "${{ matrix.test-package }}"

      - name: Generate stubs
        shell: bash
        run: |
          source .venv/bin/activate
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-1 --numpy-array-wrap-with-annotated
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-2 --numpy-array-remove-parameters
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-3 --print-invalid-expressions-as-is
          pybind11-stubgen "${{ matrix.test-package }}" -o flavour-4 --numpy-array-use-type-var
          pybind11-stubgen "${{ matrix.test-package }}" --dry-run

  publish:
    name: Publish distribution
    needs: [check, build, unit-tests, tests, test-cli-options]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
